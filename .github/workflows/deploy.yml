# Builds the site from this branch and deploys it to GitHub Pages (Settings → Pages → Source: GitHub Actions).
# The writing list comes from zenn-content's docs/publications.json, fetched at build time, so the site rebuilds when:
#   - this branch is pushed
#   - zenn-content sends a `publications` repository_dispatch after its index changes (needs a token there)
#   - every morning at 09:17 JST, after the 07:00 / 09:00 scheduled posts go live (the build lists only pieces
#     whose published_at has passed, so a scheduled post appears on its day without anyone pushing)
#   - by hand from the Actions tab
# repository_dispatch and schedule run only from the default branch, so `source` must be the default branch, and
# Settings → Environments → github-pages must allow deployments from `source`.
# A public repository's schedule turns itself off after 60 days without activity; re-enable it in the Actions tab.
name: Deploy site

on:
  push:
    branches: [source]
  repository_dispatch:
    types: [publications]
  schedule:
    - cron: '17 0 * * *' # 09:17 JST, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run sync
        env:
          FEED_REF: ${{ github.event.client_payload.sha || 'main' }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Tells IndexNow engines (Bing, Yandex) that the pages changed, so a new piece on the writing page is picked up
  # without waiting for a crawl. Only after a push or a new publication; the daily rebuild usually changes nothing.
  # The key file is emitted by site/build.mjs. A failed ping never fails the run.
  indexnow:
    needs: deploy
    if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping IndexNow with the sitemap's URLs
        continue-on-error: true
        run: |
          key=565d70d4e0464749a4c2984b43cfed7e
          urls=$(curl -fsS https://shimo4228.github.io/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | jq -R . | jq -sc .)
          jq -n --arg key "$key" --argjson urls "$urls" \
            '{host: "shimo4228.github.io", key: $key, keyLocation: "https://shimo4228.github.io/\($key).txt", urlList: $urls}' \
            | curl -sS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' --data @-
