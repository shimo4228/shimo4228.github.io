# Round r4 (2026-10-19)

- id: title-no-widow
  field: English typesetting
  what: A multi-line article title or work line does not end on one word (EN) or on two characters or fewer (JA).
  why: A lone word under a title reads as a widow, down a list of 80 titles.
  eval: {judge: machine, check: title-no-widow, env: "Chrome on macOS, reduced motion", expect: "0 at 375-1440", instances: ".piece-title on the writing pages, .work-line on the home pages"}
  cause: "site.css .piece-title { text-wrap: balance }; English untied .work-line balance; build.mjs prose() ties a Japanese paragraph's last phrases (5+ characters)"
  origin: r4-typography-en 1, r4-typography-ja 7, r5-typography-en 3, r6-art 1, r6-typography-ja 2
  status: frozen

- id: link-label-whole
  field: Japanese typesetting
  what: A link label in the About facts stays on one line.
  why: A split label breaks its words (研究) and its underline in two.
  eval: {judge: machine, check: link-label-whole, env: "Chrome on macOS", expect: "every .fact a draws one line box at 320-1280", instances: "/about/ and /ja/about/ facts"}
  cause: "site.css .fact a { word-break: keep-all }; build.mjs ties the spaces inside an English link label"
  relations:
    - unit: reflow-text-zoom
      how: co-arising — nowrap pushed ORCID past the viewport at 200% text zoom, and inline-block let a line start with the tied space after the link; keep-all and tied label spaces satisfy all three
    - unit: ja-no-space-at-line-start
      how: co-arising — an inline-block label let the next line start with its tied space
  origin: r4-typography-en 4, r4-typography-ja 2
  status: frozen

- id: ja-text-in-ja-stack
  field: Japanese typesetting
  what: Japanese running text is set in the Japanese stack with Japanese leading, on every page including the bilingual 404.
  why: Japanese poured into the English stack and leading is cramped and falls back glyph by glyph.
  eval: {judge: machine, check: ja-text-in-ja-stack, env: "Chrome on macOS", expect: "every JA p, dd, li in main: line-height >= 1.8 of the size, Hiragino Mincho in the first three families", instances: "/ja/, /ja/about/, /ja/writing/, the JA half of /404.html"}
  cause: "site.css .lost:lang(ja) { font-family; line-height }"
  origin: r4-typography-ja 1
  status: frozen

- id: underline-word-length
  field: Layout
  what: A footer link's underline is as long as its word.
