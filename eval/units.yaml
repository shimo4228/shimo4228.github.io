# Detail units. One unit = one rule of the craft (a dharma), recorded on four faces:
#   what  = characteristic (lakkhana): what the rule is
#   why   = function (rasa): what it does for the reader
#   eval  = manifestation (paccupatthana): how it shows on the rendered page, as one check with one expectation
#   cause = proximate cause (padatthana): what to change to move it
# relations lists only interference that was observed. judge: machine | hybrid | author.
# status: open | frozen | author-eye | retired. A frozen unit's check runs in `npm run units` (check name = id).
# Changing an expectation is a decision: add one line to eval/ledger.md with the author's words.

- id: ja-kinsoku-start
  field: Japanese typesetting
  what: No line starts with a closing bracket, comma, full stop, middle dot, iteration mark, prolonged sound mark or small kana; no line ends with an opening bracket (JLReq 3.1.7-3.1.8).
  why: A word split as ハ／ーネス breaks the reading; ハーネス is the word the site is about.
  eval:
    judge: machine
    check: ja-kinsoku-start
    expect: 0 lines, at every unit width, on /ja/ /ja/about/
    instances: ":lang(ja) :is(h1, h2, h3, p, dt, dd, li)"
  cause: "site.css :lang(ja) { line-break: strict }"
  relations:
    - unit: ja-quote-hang
      how: co-arising — the same :lang(ja) rule also sets text-spacing-trim, which changes the hang
  origin: r3-typography 1, ledger R3 T1
  status: frozen

- id: ja-quote-hang
  field: Japanese typesetting
  what: In a quoted section title the first letter after 「, not the mark, sits on the column edge, on every line of the title.
  why: The quoted phrase reads as a lemma aligned with its gloss; a mark that juts or a letter that sits in reads as an error.
  eval:
    judge: machine
    check: ja-quote-hang
    expect: first letter within 0.5px of the content edge, at 375 and 1280, in the author's font (Hiragino on macOS)
    instances: ".section-title:lang(ja)"
  cause: ".section-title:lang(ja):has(> q:first-child) { text-indent }, :lang(ja) { text-spacing-trim }"
  relations:
    - unit: edge-alignment
      how: co-arising — a wrong hang moves the title's first letter off the shared edge
    - unit: ja-kinsoku-start
      how: co-arising (see there)
  origin: r3-typography 2, ledger R3 T2
  status: frozen

- id: ja-sentence-lines
  field: Japanese typesetting
  what: The Japanese root sentence turns over where its phrases split; the third sentence breaks after 「著者性、」.
  why: Line breaks follow the meaning (DESIGN.md, lines turn over between phrases).
  eval:
    judge: machine
    check: ja-sentence-lines
    expect: golden lines per width (eval/golden/sentence-lines.json)
    instances: "/ja/ p.sentence"
  cause: "site.ja.json sentence open/close groups; .sentence .keep / .tail; .sentence:lang(ja) font-size"
  relations:
    - unit: sentence-size-balance
      how: co-arising — both draw on the same column width
  origin: ledger 2026-10-18 (keep/tail)
  decided_by: 2026-10-18 author, break after 著者性、 so lines follow the section split
  status: frozen

- id: en-sentence-lines
  field: English typesetting
  what: The English root sentence turns over only at its phrasing marks.
  why: Lines break between phrases, not inside them.
  eval:
    judge: machine
    check: en-sentence-lines
    expect: golden lines per width (eval/golden/sentence-lines.json)
    instances: "/ p.sentence"
  cause: "site.en.json phrasing (| and [ ]); .sentence font-size and max-inline-size"
  relations:
    - unit: sentence-size-balance
      how: co-arising
  origin: ledger 2026-10-18 phone/PC detail loop
  decided_by: 2026-10-18 author, English phrasing by phrase
  status: frozen

- id: ja-no-space-at-line-start
  field: Japanese typesetting
  what: No Japanese line starts with a space; a break point sits after a Latin–Japanese space, not before it.
  why: A leading space shifts the line by one space and breaks the edge alignment.
  eval:
    judge: machine
    check: ja-no-space-at-line-start
    expect: 0 lines, at every unit width, on /ja/ /ja/about/
    instances: ":lang(ja) :is(h1, h2, h3, p, dt, dd, li)"
  cause: "build.mjs: <wbr> placed after &nbsp;"
  relations:
    - unit: ja-quote-hang
      how: support — the edge alignment depends on lines not starting with a space
  origin: ledger R3 T8 (found in screenshots)
  status: frozen

- id: sentence-size-balance
  field: Bilingual balance
  what: The English root sentence is set about 1.15 times the Japanese one.
  why: Author — Japanese looked much smaller than English on PC. Latin needs a larger size to match Japanese optically.
  eval:
    judge: hybrid
    check: sentence-size-balance
    expect: EN/JA font-size ratio in [1.10, 1.20] at 375 and 1280; the look itself stays with the author's eye
    instances: "p.sentence on / and /ja/"
  cause: ".sentence clamp(); .sentence:lang(ja) font-size"
  relations:
    - unit: ja-sentence-lines
      how: co-arising — the Japanese size cannot grow without losing the break after 著者性、
  origin: ledger 2026-10-18 phone/PC detail loop
  decided_by: 2026-10-18 author, 「日本語がかなり小さく見える」 → lower the English side
  status: frozen

# Open and author-eye units: the rest of the adopted findings, folded by rule.

- id: ja-keep-all-scope
  field: Japanese typesetting
  what: Short lines (headings, the sentence, names, labels) keep BudouX phrases whole; running paragraphs break wherever kinsoku allows.
  why: Short lines read by phrase; running text fills the measure instead of going ragged.
  eval: {judge: machine, check: ja-keep-all-scope, env: "Chrome on macOS", expect: "no line in a short-line element breaks inside a BudouX phrase; running paragraphs end within 2 characters of the measure except their last line"}
  cause: ":lang(ja) :is(h1, h2, h3, dt, .sentence, .work-name, .entrance-group dd) { word-break: keep-all }"
  origin: R3 T4, live check 2, r6-typography-ja 4
  decided_by: "2026-10-20 author: 「aboutの日本語ページだけ改行位置変じゃないか？…文の幅がまちまちなのも変」 — the About lead stays running text (keep-all left ragged lines and, in Safari, a line ending on （)"
  status: frozen

- id: underline-extent
  field: English typesetting
  what: The drawn line under a single-line label sits just below Charter's descenders.
  why: The line is a background and cannot skip ink; at 0.15em it ran through the p, y and g of the labels.
  eval: {judge: hybrid, check: underline-extent, env: "Chrome on macOS", expect: "0.22-0.30em under the baseline for work links, footer, entrances, about-next, writing-more; 375 and 1280"}
  cause: "site.css --u-y: calc(0.5lh + 0.61em) on single-line labels"
  origin: R2 T8, Hiragino pass, r4-typography-en 2, r5-typography-en 2, r6-typography-en 1
  decided_by: "2026-10-20 author: 全部あなたの推奨でやっといて (recommendation A, just under the descenders)"
  status: frozen

- id: ja-display-face-fallback
  field: Bilingual balance
  what: Without Hiragino (Android, Windows) the Japanese display text is set in a Mincho, not a Gothic.
  why: The sentence's voice depends on the serif; a Gothic fallback changes the page.
  eval: {judge: machine, check: ja-display-face-fallback, env: "Chrome on macOS", expect: "the platform font for the JA sentence and titles is a Mincho when Hiragino is absent"}
  cause: "Shippori Mincho subset @font-face with unicode-range, after Hiragino Mincho in the stack"
  origin: phone/PC detail loop
  status: frozen

