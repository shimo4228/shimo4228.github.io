# Detail units. One unit = one rule of the craft (a dharma), recorded on four faces:
#   what  = characteristic (lakkhana): what the rule is
#   why   = function (rasa): what it does for the reader
#   eval  = manifestation (paccupatthana): how it shows on the rendered page, as one check with one expectation
#   cause = proximate cause (padatthana): what to change to move it
# relations lists only interference that was observed. judge: machine | hybrid | author.
# status: open | frozen | author-eye | retired. A frozen unit's check runs in `npm run units` (check name = id).
# Changing an expectation is a decision: add one line to eval/ledger.md with the author's words.

- id: ja-kinsoku-start
  field: Japanese typesetting
  what: No line starts with a closing bracket, comma, full stop, middle dot, iteration mark, prolonged sound mark or small kana; no line ends with an opening bracket (JLReq 3.1.7-3.1.8).
  why: A word split as ハ／ーネス breaks the reading; ハーネス is the word the site is about.
  eval:
    judge: machine
    check: ja-kinsoku-start
    expect: 0 lines, at every unit width, on /ja/ /ja/about/
    instances: ":lang(ja) :is(h1, h2, h3, p, dt, dd, li)"
  cause: "site.css :lang(ja) { line-break: strict }"
  relations:
    - unit: ja-quote-hang
      how: co-arising — the same :lang(ja) rule also sets text-spacing-trim, which changes the hang
  origin: r3-typography 1, ledger R3 T1
  status: frozen

- id: ja-quote-hang
  field: Japanese typesetting
  what: In a quoted section title the first letter after 「, not the mark, sits on the column edge, on every line of the title.
  why: The quoted phrase reads as a lemma aligned with its gloss; a mark that juts or a letter that sits in reads as an error.
  eval:
    judge: machine
    check: ja-quote-hang
    expect: first letter within 0.5px of the content edge, at 375 and 1280, in the author's font (Hiragino on macOS)
    instances: ".section-title:lang(ja)"
  cause: ".section-title:lang(ja):has(> q:first-child) { text-indent }, :lang(ja) { text-spacing-trim }"
  relations:
    - unit: ja-kinsoku-start
      how: co-arising (see there)
  origin: r3-typography 2, ledger R3 T2
  status: frozen

- id: ja-sentence-lines
  field: Japanese typesetting
  what: The Japanese root sentence turns over where its phrases split; the third sentence breaks after 「著者性、」.
  why: Line breaks follow the meaning (DESIGN.md, lines turn over between phrases).
  eval:
    judge: machine
    check: ja-sentence-lines
    expect: golden lines per width (eval/golden/sentence-lines.json)
    instances: "/ja/ p.sentence"
  cause: "site.ja.json sentence open/close groups; .sentence .keep / .tail; .sentence:lang(ja) font-size"
  relations:
    - unit: sentence-size-balance
      how: co-arising — both draw on the same column width
  origin: ledger 2026-10-18 (keep/tail)
  decided_by: 2026-10-18 author, break after 著者性、 so lines follow the section split
  status: frozen

- id: en-sentence-lines
  field: English typesetting
  what: The English root sentence turns over only at its phrasing marks.
  why: Lines break between phrases, not inside them.
  eval:
    judge: machine
    check: en-sentence-lines
    expect: golden lines per width (eval/golden/sentence-lines.json)
    instances: "/ p.sentence"
  cause: "site.en.json phrasing (| and [ ]); .sentence font-size and max-inline-size"
  relations:
    - unit: sentence-size-balance
      how: co-arising
  origin: ledger 2026-10-18 phone/PC detail loop
  decided_by: 2026-10-18 author, English phrasing by phrase
  status: frozen

- id: ja-no-space-at-line-start
  field: Japanese typesetting
  what: No Japanese line starts with a space; a break point sits after a Latin–Japanese space, not before it.
  why: A leading space shifts the line by one space and breaks the edge alignment.
  eval:
    judge: machine
    check: ja-no-space-at-line-start
    expect: 0 lines, at every unit width, on /ja/ /ja/about/
    instances: ":lang(ja) :is(h1, h2, h3, p, dt, dd, li)"
  cause: "build.mjs: <wbr> placed after &nbsp;"
  relations:
    - unit: ja-quote-hang
      how: support — the edge alignment depends on lines not starting with a space
  origin: ledger R3 T8 (found in screenshots)
  status: frozen

- id: sentence-size-balance
  field: Bilingual balance
  what: The English root sentence is set about 1.15 times the Japanese one.
  why: Author — Japanese looked much smaller than English on PC. Latin needs a larger size to match Japanese optically.
  eval:
    judge: hybrid
    check: sentence-size-balance
    expect: EN/JA font-size ratio in [1.10, 1.20] at 375 and 1280; the look itself stays with the author's eye
    instances: "p.sentence on / and /ja/"
  cause: ".sentence clamp(); .sentence:lang(ja) font-size"
  relations:
    - unit: ja-sentence-lines
      how: co-arising — the Japanese size cannot grow without losing the break after 著者性、
  origin: ledger 2026-10-18 phone/PC detail loop
  decided_by: 2026-10-18 author, 「日本語がかなり小さく見える」 → lower the English side
  status: frozen

# Open and author-eye units: the rest of the adopted findings, folded by rule.

- id: ja-keep-all-scope
  field: Japanese typesetting
  what: Short lines (headings, the sentence, names, labels) keep BudouX phrases whole; running paragraphs break wherever kinsoku allows.
  why: Short lines read by phrase; running text fills the measure instead of going ragged.
  eval: {judge: machine, expect: "no line in a short-line element breaks inside a BudouX phrase; running paragraphs end within 2 characters of the measure except their last line"}
  cause: ":lang(ja) :is(h1, h2, h3, dt, .sentence, .work-name, .entrance-group dd) { word-break: keep-all }"
  origin: R3 T4, live check 2
  status: open

- id: underline-extent
  field: Japanese typesetting
  what: A link underline ends at the text — it does not run under a trailing 、 or the empty half of a bracket — and clears descenders.
  why: An underline over blank space reads as a stray mark.
  eval: {judge: hybrid, expect: "underline box ends within 1px of the last ink glyph; offset decided by the author"}
  cause: "the 、 outside the link in build.mjs; halt on JA work links; text-underline-offset"
  origin: R2 T8, Hiragino pass
  status: open

- id: ja-display-face-fallback
  field: Bilingual balance
  what: Without Hiragino (Android, Windows) the Japanese display text is set in a Mincho, not a Gothic.
  why: The sentence's voice depends on the serif; a Gothic fallback changes the page.
  eval: {judge: machine, expect: "the platform font for the JA sentence and titles is a Mincho when Hiragino is absent"}
  cause: "Shippori Mincho subset @font-face with unicode-range, after Hiragino Mincho in the stack"
  origin: phone/PC detail loop
  status: open

- id: lang-marks
  field: Page metadata
  what: Every run of text in the other language carries its lang attribute.
  why: Screen readers and line breaking pick rules by lang.
  eval: {judge: machine, expect: "0 Latin-only text blocks without lang=en inside /ja/ pages, and the reverse"}
  cause: "build.mjs lang attributes on dd and quoted English"
  origin: R3 A2, V4
  status: open

- id: typographic-punctuation
  field: English typesetting
  what: Visible text uses typographic apostrophes and quotes, including the feed titles on the writing pages.
  why: Straight quotes read as unedited next to the typographic ones on the rest of the site.
  eval: {judge: machine, check: typographic-punctuation, env: "Chrome, 1280", expect: "0 straight ' or \" in visible text on every page", instances: "all pages, text outside code"}
  cause: "content/site.*.json strings; build.mjs typographic() on feed titles"
  origin: R1, r4-author 1
  status: frozen

- id: type-scale-roles
  field: Layout
  what: Each type role has one size and face (one title size both sides, JA rail titles capped, the display face only for the name and titles).
  why: A role that changes size between pages reads as two roles.
  eval: {judge: machine, expect: "computed font-size and family per role equal across pages at each width"}
  cause: "site.css role sizes; tokens.mjs"
  origin: R2 T7, T14, R3 T3
  status: open

- id: edge-alignment
  field: Layout
  what: Text that shares a column starts on the same edge; rail titles sit on the gloss baseline.
  why: Edges 1–3px apart read as a mistake.
  eval: {judge: machine, expect: "0 left edges 1-3px apart at the key widths (run.mjs near-miss)"}
  cause: "site.css grid and padding"
  origin: R2 T6
  status: open

- id: entrance-grid
  field: Layout
  what: The entrance groups sit in rows of equal count at every width, never 3 + 1.
  why: A lone group on the last row reads as left over.
  eval: {judge: machine, expect: "every row of .entrance-group holds the same count, 320-1920"}
  cause: "site.css .entrance-groups grid-template-columns"
  origin: R2 T2
  status: retired

- id: sticky-rail-quotes
  field: Layout
  what: At 48rem and wider each quoted section title stays in view while its gloss scrolls.
  why: The quote and its gloss read together.
  eval: {judge: machine, check: sticky-rail-quotes, env: "Chrome, reduced motion", expect: "title top stays at its sticky offset while the gloss scrolls, at 768 and 1280"}
  cause: "site.css: the 48rem .gloss > .section-title { position: sticky } after the position: relative rule for landing marks"
  origin: R3 R1
  status: frozen

- id: no-overflow
  field: Layout
  what: Nothing runs past the viewport, including long tokens.
  why: Horizontal scroll on a phone breaks reading.
  eval: {judge: machine, check: no-overflow, env: "Chrome, reduced motion", expect: "0 blocks past the viewport at 320-1920 (run.mjs overflow)"}
  cause: "overflow-wrap: break-word; widths in site.css"
  relations:
    - unit: en-sentence-lines
      how: co-arising — moving a phrasing mark made an unbreakable group overflow at 320
  origin: R3 A4
  status: frozen

- id: text-zoom
  field: Accessibility
  what: Text grows with page and text zoom; no size is set in vw alone.
  why: WCAG 1.4.4.
  eval: {judge: machine, check: text-zoom, env: "Chrome, reduced motion", expect: "every font-size grows when the root size doubles"}
  cause: "max(min(..., vw), rem) floors in site.css"
  relations:
    - unit: ja-sentence-lines
      how: co-arising — the JA sentence size is the zoom floor; a vw-only size also moved its line breaks
    - unit: sentence-size-balance
      how: co-arising — the same font-size declaration
  origin: R3 A1
  status: frozen

- id: target-size
  field: Accessibility
  what: Links outside running text are at least 24 by 24 px.
  why: WCAG 2.5.8.
  eval: {judge: machine, expect: "0 targets under 24px (run.mjs target-size)"}
  cause: "padding on entrance and work links"
  origin: R2 V6, entrances
  status: open

- id: focus-visible
  field: Accessibility
  what: Every tab stop shows a focus ring.
  why: Keyboard users see where they are.
  eval: {judge: machine, expect: "every tab stop has an outline (run.mjs focus-visible)"}
  cause: ":focus-visible outline in site.css"
  origin: R2 X-C6
  status: open

- id: forced-colors
  field: Accessibility
  what: In forced colors, lines, borders and focus stay visible.
  why: Windows high contrast drops background-drawn marks.
  eval: {judge: machine, expect: "rails, hairlines and focus rings keep a visible border under forced-colors emulation"}
  cause: "@media (forced-colors: active) blocks"
  origin: R2 X-B1
  status: open

- id: print
  field: Accessibility
  what: Printed pages use the light palette, print link URLs, and set Japanese at 16pt.
  why: A dark screen palette prints grey on grey.
  eval: {judge: machine, expect: "under print emulation: light tokens, URLs after external links, JA sentence 16pt"}
  cause: "@media print in site.css"
  origin: R2 X1, X2, R3 A3
  status: open

- id: icons
  field: Page metadata
  what: /favicon.ico exists, and the mark keeps the page ground in light and dark.
  why: A 404 on the icon and a dark block in a light tab bar both read as unfinished.
  eval: {judge: hybrid, expect: "favicon.ico 200; the mark's ground matches each scheme"}
  cause: "images.mjs icons; favicon.svg media query"
  origin: R3 A5, R7
  status: open

- id: head-metadata
  field: Page metadata
  what: theme-color, JSON-LD with the shared Person id, the ownership file and the analytics token are present.
  why: Search and sharing read these, and losing one is silent.
  eval: {judge: machine, check: head-metadata, env: "Chrome, reduced motion", expect: "theme-color for both schemes, the analytics beacon and an icon link on every page; JSON-LD Person with the shared @id on / and /ja/"}
  cause: "build.mjs head"
  origin: R1, Search Console, analytics
  status: frozen

- id: no-dead-ends
  field: Copy
  what: Every page links on to the rest of the site.
  why: A visitor who reaches About should find the projects.
  eval: {judge: machine, check: no-dead-ends, env: "Chrome, reduced motion", expect: "every page has a link to / (or /ja/) outside the header"}
  cause: "About and 404 page templates in build.mjs"
  origin: R3 V2
  status: frozen

- id: authors-words-verbatim
  field: Copy
  what: The bio and the hub one-liners appear in the author's words.
  why: The site speaks in the author's voice.
  eval: {judge: machine, expect: "the build's bio and phrasing drift checks pass"}
  cause: "build.mjs drift checks against content/*.json"
  origin: R1, R3 V4
  status: open

- id: spacing-rhythm
  field: Layout
  what: Rows and gaps follow the spacing scale (footer rows, entrance name to description).
  why: Uneven gaps make related things read as unrelated.
  eval: {judge: author, expect: "the author's eye at 375 and 1280"}
  cause: "space tokens"
  origin: R2 T4, entrances
  status: author-eye

- id: section-intros
  field: Copy
  what: Each section intro says what the section holds.
  why: The intro promises what follows.
  eval: {judge: author, expect: "the author's read"}
  cause: "content/site.*.json intros"
  origin: R2 V1, R3 V1, V3
  status: author-eye

- id: page-family
  field: Layout
  what: About and 404 share the gloss layout of the home page.
  why: The pages read as one site.
  eval: {judge: author, expect: "the author's eye"}
  cause: "page templates"
  origin: R3 R4, R6
  status: author-eye

- id: state-marks
  field: Layout
  what: Landing on a section shows the moss mark; links that leave the site look different from links that stay.
  why: The reader knows where they arrived and where a link goes.
  eval: {judge: author, expect: "the author's eye"}
  cause: ":target bar; footer link underline"
  origin: R3 R2, R5
  status: author-eye

- id: whole-page
  field: Layout
  what: The page as a whole, in the author's fonts.
  why: No set of units adds up to the impression.
  eval: {judge: author, expect: "the author's eye in Hiragino, light and dark"}
  cause: "everything"
  origin: Hiragino pass
  status: author-eye
