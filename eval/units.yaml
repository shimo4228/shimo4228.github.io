  eval: {judge: machine, check: underline-word-length, env: "Chrome on macOS", expect: "content box within 1.5px of the text width for every footer link", instances: ".site-foot a"}
  cause: "site.css .site-foot a: padding and negative margin for the target, min-inline-size 0"
  relations:
    - unit: target-size
      how: co-arising — the 24px target now comes from padding instead of min-inline-size
  origin: r4-art 3
  status: frozen

