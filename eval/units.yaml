  field: Accessibility
  what: Text grows with page and text zoom; no size is set in vw alone.
  why: WCAG 1.4.4.
  eval: {judge: machine, check: text-zoom, env: "Chrome, reduced motion", expect: "every font-size grows when the root size doubles"}
  cause: "max(min(..., vw), rem) floors in site.css"
  relations:
    - unit: sentence-link-large
      how: co-arising — the rem floor holds both
    - unit: ja-sentence-lines
      how: co-arising — the JA sentence size is the zoom floor; a vw-only size also moved its line breaks
    - unit: sentence-size-balance
      how: co-arising — the same font-size declaration
  origin: R3 A1
  status: frozen

